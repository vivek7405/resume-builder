# How resume-builder runs on pilots. `pilot deploy` and a push to main both use
# this file, which wins over compose.yaml (the laptop's docker compose setup).
#
# One service, named for its address: resume-builder.pilotrun.app. SQLite lives
# on the volume so resumes survive every deploy, and a volume-backed service runs
# one replica. Pull request previews are sandboxes built from the same Dockerfile
# with no volume, so a preview gets its own empty database and never touches this one.
name: resume-builder
services:
  resume-builder:
    build: .
    environment:
      PORT: 8080
      DATABASE_URL: file:/data/resume-builder.db
    volumes:
      - resume-data:/data
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://127.0.0.1:'+(process.env.PORT||8080)+'/__webjs/ready').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 15s
      timeout: 3s
      start_period: 40s
      retries: 5
    x-pilots:
      domain: resume-builder
      size_gib: 1

volumes:
  resume-data:
