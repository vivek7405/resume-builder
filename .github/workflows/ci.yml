name: CI

# GitHub Actions is the CI for resume-builder: this workflow is the gate, on
# every PR into main and every push to main. A push is all it takes to run it,
# so nothing has to pass on a developer machine first.
#
# One job per check, so each one is its own status on the PR and can be required
# on its own in the branch-protection rule for main. fail-fast is off so one red
# check does not hide the others.
#
# Each job runs one entry of the step list in package.json, under
# "webjs": { "ci": { "steps": [...] } }, by its title. A check added there has to
# be added to the matrix below too; test/ci/ci-workflow.test.ts fails until it
# is. The list's Setup step is not in the matrix because every job migrates the
# database itself.
#
# Free on public repos (ubuntu-latest has unlimited Actions minutes).

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

# A newer push to the same branch cancels the older in-flight run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: ${{ matrix.check }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: file:./ci.db
    strategy:
      fail-fast: false
      matrix:
        check:
          - 'Conventions'
          - 'Health'
          - 'Types'
          - 'Security: dependency audit'
          - 'Tests: server'
          - 'Tests: browser'
          - 'Tests: e2e'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install
      - name: Install Playwright Chromium
        if: "matrix.check == 'Tests: browser' || matrix.check == 'Tests: e2e'"
        run: bunx playwright install --with-deps chromium
      # The e2e tests drive a real browser via puppeteer-core, which is not a
      # default dependency (they skip when it is absent). Install it so the e2e
      # check runs here rather than skipping silently.
      - name: Install puppeteer-core
        if: "matrix.check == 'Tests: e2e'"
        run: bun add --no-save puppeteer-core
      - name: Resolve the Chromium binary path
        if: "matrix.check == 'Tests: browser' || matrix.check == 'Tests: e2e'"
        run: echo "CHROMIUM_PATH=$(node -e "console.log(require('playwright-core').chromium.executablePath())")" >> "$GITHUB_ENV"
      - name: Set up the database (generate + apply migrations)
        run: bun run db:generate && bun run db:migrate
      # Everything above prepares the runner. This is the check.
      - name: Run the check
        run: bun run ci -- --only "${{ matrix.check }}"
